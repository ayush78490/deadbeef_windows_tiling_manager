; nerdy-deadbeef · launcher (READ-ONLY TEMPLATE)
; Adapted from ChrisTitusTech's fuzzel.ini for Windows.
;
; [main] is read by deadbeef's `launcher` dispatcher (bind = SUPER, R, launcher).
; `command = builtin` uses deadbeef's own PowerToys-Run-style launcher, drawn
; with the [colors] / [border] below. Set a program instead to use another
; launcher (e.g. %LOCALAPPDATA%\FlowLauncher\Flow.Launcher.exe).
; [colors] / [border] are the Nord launcher palette, exposed to the config as
; $launcher_<key> variables (e.g. $launcher_background) and to Lua as
; deadbeef.launcher.colors, so bars and launcher themes can share one palette.

[main]
command = builtin
; Rows shown and panel width (px at 100% scaling).
lines = 8
width = 680
terminal = wt
; Falls back to Segoe UI if the font isn't installed.
font = JetBrainsMono Nerd Font
prompt = "> "
match-mode = fzf

[colors]
background = 2e3440ff
text = e5e9f0ff
prompt = 88c0d0ff
placeholder = 4c566aff
input = e5e9f0ff
match = ebcb8bff
selection = 3b4252ff
selection-text = e5e9f0ff
selection-match = ebcb8bff
counter = 4c566aff
border = 88c0d0ff

[border]
width = 1
radius = 10
