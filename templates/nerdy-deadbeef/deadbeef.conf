#  ┌──────────────────────────────────────────────────────────────────┐
#  │  nerdy-deadbeef · deadbeef template                              │
#  │  Nord palette · cyan gradient borders · rounded corners          │
#  │  Inspired by ChrisTitusTech/hyprland-titus, rebuilt for Windows  │
#  └──────────────────────────────────────────────────────────────────┘
#
#  THIS IS A READ-ONLY TEMPLATE. deadbeef copies it to
#      %APPDATA%\deadbeef\profiles\active\
#  on first launch. Edit the copy there — it hot-reloads on save.
#
#      dbctl profile apply nerdy-deadbeef   reset active profile to this template
#      dbctl profile save  my-setup         snapshot the active profile
#      dbctl profile switch my-setup        load a saved snapshot


################
### STYLE    ###
################

source = %APPDATA%\deadbeef\profiles\active\style.conf


################
### MONITORS ###
################
# monitor = INDEX, RESOLUTION, POSITION, SCALE
#   INDEX       0 = primary, then left-to-right (see `dbctl monitors`)
#   RESOLUTION  preferred | WIDTHxHEIGHT | WIDTHxHEIGHT@HZ
#   POSITION    auto | XxY (ignored for the primary monitor, which is always 0x0)
#   SCALE       informational — Windows owns per-monitor scaling (Settings > Display)
# monitor = INDEX, addreserved, TOP, BOTTOM, LEFT, RIGHT   reserve px for a bar
# monitor = INDEX, disable                                 never tile on that monitor

monitor = 0, preferred, 0x0, 1
# monitor = 1, preferred, auto, 1
# monitor = 0, addreserved, 32, 0, 0, 0


###################
### MY PROGRAMS ###
###################

$terminal = wt
$fileManager = explorer.exe
$browser = msedge


#################
### AUTOSTART ###
#################
# exec-once runs once per deadbeef session, exec on every config reload.

# deadbeef draws its own top bar (bar { } in style.conf). To use yasb
# instead, set bar:enabled = false and uncomment:
# exec-once = yasb
exec-once = flow-launcher --startup


#################
### SCRIPTING ###
#################
# Lua macros (`bind = ..., lua, fn`) and window-open hooks.

script = %APPDATA%\deadbeef\profiles\active\deadbeef.lua


###################
### KEYBINDINGS ###
###################
# bind = MODS, KEY, DISPATCHER, ARGS
#   MODS  SUPER (Win) · ALT · CTRL · SHIFT — space separated
#   KEY   A-Z, 0-9, F1-F24, left/right/up/down, Return, space, Tab, Print, comma, period, …
# Combos Windows already owns (most Win+key) are taken over via a low-level
# keyboard hook — see input:hotkey_fallback in style.conf.

$mainMod = SUPER

bind = $mainMod, X, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, R, launcher
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, M, exit
bind = $mainMod SHIFT, R, reload
bind = $mainMod, V, togglefloating
bind = $mainMod, J, togglesplit
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1      # maximise, keeping gaps and the bar
bind = $mainMod, P, pin
bind = $mainMod, C, centerwindow
bind = $mainMod, M, layout, toggle
bind = $mainMod, G, lua, toggle_gaps
bind = $mainMod, Print, exec, explorer.exe ms-screenclip:

# Keybinding cheat sheet (type to filter, Esc to close)
bind = $mainMod, F1, binds
bind = $mainMod, slash, binds

# Wallpapers: picker (wallhaven.cc) / random downloaded one
bind = $mainMod, W, wallpaper
bind = $mainMod SHIFT, W, wallpaper, random

# Focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, Tab, cyclenext

# Move windows within the layout
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Resize the split / master area
bind = $mainMod CTRL, left, splitratio, -0.1
bind = $mainMod CTRL, right, splitratio, +0.1

# Monitors
bind = $mainMod, period, focusmonitor, +1
bind = $mainMod, comma, focusmonitor, -1
bind = $mainMod SHIFT, period, movewindow, mon:+1
bind = $mainMod SHIFT, comma, movewindow, mon:-1

# Workspaces → Windows virtual desktops (created on demand)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod CTRL, down, workspace, e+1
bind = $mainMod CTRL, up, workspace, e-1


##################
### WORKSPACES ###
##################
# workspace = N, monitor:INDEX   windows sent to workspace N land on that monitor
# workspace = N, layout:master   per-workspace layout

workspace = 4, monitor:1


####################
### WINDOW RULES ###
####################
# windowrule = ACTION, MATCHER[, MATCHER...]   (all matchers must match)
#   MATCHERS  exe:REGEX   class:REGEX   title:REGEX
#   ACTIONS   float · tile · center · pin · fullscreen · maximize · noborder · ignore
#             workspace N [silent] · monitor N · opacity A [B] · size W H · move X Y
#             (size/move accept px or %, relative to the monitor work area)

windowrule = float, exe:^(calc\.exe|CalculatorApp\.exe)$
windowrule = size 420 640, exe:^(CalculatorApp\.exe)$
windowrule = center, exe:^(CalculatorApp\.exe)$
windowrule = float, exe:^(Taskmgr\.exe)$
windowrule = float, exe:^(SnippingTool\.exe|ScreenClippingHost\.exe)$
windowrule = float, title:^(Picture[- ]in[- ][Pp]icture)$
windowrule = pin, title:^(Picture[- ]in[- ][Pp]icture)$
windowrule = float, class:^(#32770)$
windowrule = workspace 4 silent, exe:^(steam\.exe)$
windowrule = ignore, exe:^(Flow\.Launcher\.exe|yasb\.exe|PowerToys.*\.exe)$
# Keep video and games fully opaque even when unfocused.
windowrule = opacity 1.0, exe:^(vlc\.exe|mpv\.exe|PotPlayerMini64\.exe|steam\.exe)$
