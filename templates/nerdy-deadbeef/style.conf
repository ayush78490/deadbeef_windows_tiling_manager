#  nerdy-deadbeef · style (READ-ONLY TEMPLATE)
#  Nord: https://www.nordtheme.com/docs/colors-and-palettes

# Polar Night
$nord0  = rgb(2e3440)
$nord1  = rgb(3b4252)
$nord2  = rgb(434c5e)
$nord3  = rgb(4c566a)
# Snow Storm
$nord4  = rgb(d8dee9)
$nord6  = rgb(eceff4)
# Frost
$nord7  = rgb(8fbcbb)
$nord8  = rgb(88c0d0)
$nord9  = rgb(81a1c1)
$nord10 = rgb(5e81ac)
# Aurora
$nord11 = rgb(bf616a)
$nord13 = rgb(ebcb8b)
$nord14 = rgb(a3be8c)
$nord15 = rgb(b48ead)

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    # Windows 11 DWM draws a solid border (first colour of the gradient).
    # The Direct2D overlay (Windows 10, or border_overlay = on) draws the full gradient.
    col.active_border = rgba(88c0d0ff) rgba(81a1c1ff) 45deg
    col.inactive_border = rgba(4c566aaa)
    no_border_on_floating = false

    # auto = DWM border on Windows 11, Direct2D overlay on Windows 10
    border_overlay = auto

    layout = dwindle
}

decoration {
    rounding = 10            # 0 square · 1-4 small · 5+ round (DWM corner preference)
    active_opacity = 1.0
    inactive_opacity = 0.88  # unfocused windows turn translucent

    blur {
        # Windows 11 22H2+ system backdrop. Visible in apps that draw a
        # transparent background (e.g. Windows Terminal with "useMica").
        enabled = true
        backdrop = acrylic   # mica | acrylic | tabbed
    }
}

animations {
    enabled = yes

    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    bezier = smoothIn, 0.25, 1, 0.5, 1
    bezier = smoothOut, 0.36, 0, 0.66, -0.56

    # animation = NAME, ON/OFF, SPEED (x100ms), CURVE[, STYLE]
    animation = windows, 1, 3, overshot, slide
    animation = windowsIn, 1, 3, smoothIn, popin 80%
    animation = windowsMove, 1, 3, smoothIn
    animation = border, 1, 10, default
}

dwindle {
    default_split_ratio = 1.0   # 0.1 - 1.9, 1.0 = even
    spiral = false              # true = rotate each split (fibonacci spiral)
}

master {
    mfact = 0.55
    new_status = master
    orientation = left
}

# ── Top bar (replaces the Windows taskbar) ─────────────────────────────
# Modules: launcher workspaces apps title clock cpu memory temperature
#          volume wifi bluetooth battery wallpaper power
# Click a module for its flyout; scroll on workspaces / volume.
bar {
    enabled = true
    hide_taskbar = true      # restored automatically when deadbeef quits
    height = 36
    monitors = all           # all | primary
    font =                   # empty = Segoe UI Variable; e.g. JetBrainsMono Nerd Font
    font_size = 13
    clock_format = %a %d %b  %H:%M

    col.background = rgba(2e3440e6)
    col.foreground = rgba(d8dee9ff)
    col.accent = rgba(88c0d0ff)
    col.dim = rgba(4c566aff)
    col.warning = rgba(ebcb8bff)
    col.critical = rgba(bf616aff)

    modules-left = launcher workspaces apps
    modules-center = clock
    modules-right = cpu memory temperature volume wifi bluetooth battery wallpaper power
}

# ── Wallpapers (wallhaven.cc) ──────────────────────────────────────────
# SUPER+W opens the picker: browse, pick, it downloads, then applies with
# an animated transition. Downloads are kept in `directory`.
wallpaper {
    transition = grow        # grow | wipe | fade | none
    duration = 1.2           # seconds
    bezier = smoothIn
    query =                  # default search; empty = toplist
    sorting = toplist        # toplist | date_added | relevance | random | views | favorites | hot
    top_range = 1M           # for toplist: 1d 3d 1w 1M 3M 6M 1y
    categories = 110         # general / anime / people
    purity = 100             # sfw / sketchy / nsfw (sketchy+nsfw need an apikey)
    atleast =                # minimum resolution; empty = your primary monitor
    apikey =
    directory = %APPDATA%\deadbeef\wallpapers
}

input {
    # Explorer reserves most Win+key combos, so RegisterHotKey cannot claim them.
    # When on, those binds are captured by a WH_KEYBOARD_LL hook instead.
    hotkey_fallback = true

    # 1 = the window under the mouse becomes active (Hyprland default), 0 = click to focus
    follow_mouse = 1
}

misc {
    float_dialogs = true         # owned windows and #32770 dialogs float
    float_unresizable = true     # windows without a resize frame float
    notify_errors = true         # tray balloon on config errors
}
